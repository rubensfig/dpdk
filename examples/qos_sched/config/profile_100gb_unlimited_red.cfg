; ---------------------------------------------------------------------------
; RED with ECN marking (rte_sched CMAN). Copy of profile_100gb_unlimited.cfg
; plus this section.
;
; * ECT(0)/ECT(1) packets are marked CE instead of dropped; Not-ECT packets
;   (e.g. the Ixia UDP groups) are DROPPED early. RED is therefore on only for
;   the TCP class. min = max = 0 leaves a TC on plain tail drop.
; * TC = DSCP (TOS >> 2), clamped to 12 (app_thread.c, get_pkt_sched).
;   iperf3 -S 4 -> TOS 0x04 -> DSCP 1 -> TC 1. VLC/HTTPS (DSCP 0) lands in TC 0
;   with the HP Ixia group; set DSCP 1 on the servers to move it here.
; * Thresholds are in packets and must stay below the queue size (64 above),
;   otherwise tail drop fires before RED marks.
; * weight = wq_log2 (EWMA gain 1/2^w). The upstream default 9 (1/512) is far
;   too slow for a 64-packet queue: tail drop would win. Use 1..3.
; * Only the first value (green) matters: qos_sched colours everything green.
; ---------------------------------------------------------------------------
[red]
tc 0 red min = 0 0 0
tc 0 red max = 0 0 0
tc 0 red inv prob = 10 10 10
tc 0 red weight = 2 2 2

tc 2 red min = 16 16 16
tc 2 red max = 48 48 48
tc 2 red inv prob = 10 10 10
tc 2 red weight = 2 2 2
