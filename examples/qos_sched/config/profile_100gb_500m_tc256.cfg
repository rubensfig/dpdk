; Port configuration
[port]
frame overhead = 24
number of subports per port = 1

; Subport configuration
[subport 0]
number of pipes per subport = 4096
; Evaluation profile (plan v5, Table 1 b): TC0 VoIP 64, TC1 IPTV 64,
; TC2 Internet 256 packets per pipe, twice the largest per-subscriber burst
; (B/64 = 128 frames at B = 8,192). 1,000 used pipes then hold 384,000
; packets, which fit the 524,288-mbuf pool of an instance (NB_MBUF), so the
; scheduler drops at the queue tail and RX never runs out of mbufs.
; Same as profile_100gb_500m.cfg except the TC2 queue size.
queue sizes = 64 64 256 64 64 64 64 64 64 64 64 64 64
# queue sizes = 1024 1024 1024 1024 1024 1024 1024 1024 1024 1024 1024 1024 1024

# pipe 0 - 16383 = 0               ; These pipes are configured with pipe profile 0
pipe 0 - 4095  = 0               ; These pipes are configured with pipe profile 0

